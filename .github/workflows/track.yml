name: Trainer Tracker

on:
  schedule:
    - cron: '10 15 * * *' 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        range: [[0, 20], [20, 40], [40, 60], [60, 80], [80, 100], [100, 120], [120, 140], [140, 160], [160, 180], [180, 200]]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #Installs required external libraries for the scraping job environment
      - name: Install Python Dependencies
        run: pip install pymongo curl_cffi requests

      - name: Add Human Jitter Delay
        shell: cmd # Bypasses PowerShell ExecutionPolicy restrictions completely on all PCs
        if: matrix.range[0] == 0
        run: python -c "import time, random; delay = random.randint(43, 378); print(f'Sleeping for {delay}s...'); time.sleep(delay)"

      - name: Sync Batch
        run: python main.py ${{ matrix.range[0] }} ${{ matrix.range[1] }} 
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup_and_notify:
    needs: scrape
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # Installs required external libraries for the notification and cleanup environment
      - name: Install Python Dependencies
        run: pip install pymongo requests
      
      - name: Final Leaver Check
        run: python notify.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
