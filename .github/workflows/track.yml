name: Trainer Tracker

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      matrix:
        # Strictly 20 clubs per sequential batch
        range: [[0, 20], [20, 40], [40, 60], [60, 80], [80, 100], [100, 120], [120, 140], [140, 160], [160, 180], [180, 200]]
    steps:
      - uses: actions/checkout@v4

      - name: Add Human Jitter Delay
        # If it's the very first batch (0 to 20), sleep for a random time between 1 and 15 minutes.
        # This breaks up the strict 11:10 PM cron schedule so your home IP patterns look organic.
        if: matrix.range[0] == 0
        run: python -c "import time, random; delay = random.randint(60, 900); print(f'Sleeping for {delay}s...'); time.sleep(delay)"

      - name: Sync Batch
        run: py main.py ${{ matrix.range[0] }} ${{ matrix.range[1] }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup_and_notify:
    needs: scrape
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Final Leaver Check
        run: py notify.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
