name: Uma Tracker Daily Run

on:
  schedule:
    - cron: '10 15 * * *' # 11:10 PM PHT
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest  # FIXED PROPERTY
    strategy:
      matrix:
        range: ["0 300", "300 600", "600 900", "900 1200", "1200 1500"]
      max-parallel: 1  # STAGGERED TO AVOID GHOST BLOCK
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pymongo dnspython

      - name: Run Tracking Batch
        run: python main.py ${{ matrix.range }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup-and-report:
    needs: track
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pymongo dnspython

      - name: Final Cleanup
        run: python main.py CLEANUP
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
