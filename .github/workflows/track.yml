name: Torena Tracker

on:
  schedule:
    - cron: '10 15 * * *' # Runs daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    strategy:
      max-parallel: 1 # CRITICAL: Runs one batch at a time so your IP isn't overwhelmed
      matrix:
        # This defines the [start, end] for each batch
        range: [[0, 20], [20, 40], [40, 60], [60, 80], [80, 100]]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Batch
        # Accesses the specific range for this batch
        run: py main.py ${{ matrix.range[0] }} ${{ matrix.range[1] }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Cool Down
        # Wait 2 minutes between batches to let your home IP "rest"
        run: py -c "import time; time.sleep(120)"
