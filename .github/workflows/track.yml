name: UMA Top 1500 Tracker

on:
  schedule:
    - cron: "10 15 * * *"  # runs daily (11:10 PM PH time)
  workflow_dispatch:

# 🔥 THIS IS THE MISSING FIX
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # optional but safer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit state changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add state/member_state.json
          git commit -m "Update state" || exit 0
          git push
