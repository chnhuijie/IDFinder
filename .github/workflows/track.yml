name: UMA Top 1500 Tracker

on:
  schedule:
    - cron: "10 15 * * *"  # 11:10 PM PH Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Added safety timeout for the 1500-club scan
    timeout-minutes: 30 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Pull first to prevent "non-fast-forward" errors if the repo changed
          git pull origin main 
          git add state/member_state.json
          git commit -m "Update state: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
