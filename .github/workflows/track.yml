name: Uma ID Tracker 1500

on:
  workflow_dispatch: # Allows you to run it manually anytime
  schedule:
    # 11:10 PM PHT is 15:10 UTC
    - cron: '10 15 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {s: 0, e: 300}
          - {s: 300, e: 600}
          - {s: 600, e: 900}
          - {s: 900, e: 1200}
          - {s: 1200, e: 1500}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pymongo dnspython
      - name: Run Scraper Job
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python main.py ${{ matrix.s }} ${{ matrix.e }}

  cleanup-and-report:
    needs: scrape # Waits for all 5 scrapers to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pymongo dnspython
      - name: Report and Prune Vanished Players
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python main.py CLEANUP 0
