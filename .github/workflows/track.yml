name: Uma Tracker - Top 100 (20-Block Stealth)

on:
  schedule:
    - cron: '10 15 * * *' # 11:10 PM PHT
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 
      matrix:
        # 5 batches of 20 clubs = Top 100
        range: ["0 20", "20 40", "40 60", "60 80", "80 100"]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4
          pip install curl_cffi pymongo dnspython

      - name: Stealth Run
        run: python main.py ${{ matrix.range }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
