name: Trainer tracker

on:
  schedule:
    # Runs at 15:10 UTC (11:10 PM PHT)
    - cron: '10 15 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  track:
    runs-with: ubuntu-latest
    strategy:
      matrix:
        # Splits the 1500 IDs into 5 parallel batches
        range: ["0 300", "300 600", "600 900", "900 1200", "1200 1500"]
      max-parallel: 3 # Limits concurrency to avoid "Matrix Overload"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pymongo dnspython

      - name: Run Tracking Batch
        run: python main.py ${{ matrix.range }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup-and-report:
    needs: track # Ensures cleanup only runs AFTER all tracking is done
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pymongo dnspython

      - name: Final Cleanup and Vanished Report
        run: python main.py CLEANUP
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
