name: Trainer Tracker 

on:
  schedule:
  workflow_dispatch:     

jobs:
  scrape:
    name: Scrape Ranks ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  
      matrix:
        include:
          - start: 0
            end: 100
          - start: 100
            end: 200
          - start: 200
            end: 300
          - start: 300
            end: 400
          - start: 400
            end: 500

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install curl_cffi pymongo requests

      - name: Run Scraper (With Auto-Retry)
        uses: nick-fields/retry@v3
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          timeout_minutes: 30
          max_attempts: 3            
          retry_wait_seconds: 30    
          command: python main.py ${{ matrix.start }} ${{ matrix.end }}

  cleanup_and_notify:
    name: Final Leaver Check and Transfer Analysis
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests pymongo

      - name: Run notify.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

  alert_on_failure:
    name: Discord Alert
    needs: [scrape, cleanup_and_notify]
    if: failure()  
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Ping to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \" **ALERT:** The Trainer Tracker GitHub Action just failed! \\n\\n **Check logs here:** <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
          $DISCORD_WEBHOOK_URL
