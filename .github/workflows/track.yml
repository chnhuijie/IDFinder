name: Trainer Tracker

on:
  schedule:
    - cron: '10 10 * * *' 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 0
            end: 100
          - start: 100
            end: 200
          - start: 200
            end: 300
          - start: 300
            end: 400
          - start: 400
            end: 500
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pymongo curl_cffi requests

      - name: Humanized Initial Jitter Delay
        run: |
          JITTER_TIME=$((10 + RANDOM % 81))
          echo "⏱️ Jitter activated! Sleeping for $JITTER_TIME seconds..."
          sleep $JITTER_TIME
          echo "🚀 Cooldown over. Launching stream chunk!"

      - name: Sync Batch
        run: python main.py ${{ matrix.start }} ${{ matrix.end }} 
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }} 
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup_and_notify:
    needs: scrape
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: pip install pymongo requests
      
      - name: Final Leaver Check and Transfer Analysis
        run: python notify.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
