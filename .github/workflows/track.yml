name: Uma Tracker
on:
  schedule:
    - cron: '10 15 * * *' # 11:10 PM Manila Time
  workflow_dispatch:      # Allows manual "Run Workflow"

jobs:
  scrape:
    runs-on: self-hosted  # Targets your PC

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stealth Sync
        # Using 'py' to bypass the Windows Path issues we saw
        run: py main.py 0 20
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Jitter Delay
        # Keeps your residential IP reputation clean for the next run
        run: py -c "import time, random; time.sleep(random.randint(30, 90))"
