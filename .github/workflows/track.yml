name: Trainer Tracker

on:
  schedule:
    # 11:10 PM Manila Time (15:10 UTC)
    - cron: '10 15 * * *' 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      matrix:
        # Strictly 20 clubs per batch
        range: [[0, 20], [20, 40], [40, 60], [60, 80], [80, 100]]
    steps:
      - uses: actions/checkout@v4
      - name: Sync Batch
        run: py main.py ${{ matrix.range[0] }} ${{ matrix.range[1] }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup_and_notify:
    needs: scrape
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Final Leaver Check
        run: py notify.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
