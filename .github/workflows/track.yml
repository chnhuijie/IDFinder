name: Uma Tracker Layer 1

on:
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest  # Fixed syntax error
    strategy:
      matrix:
        range: ["0 300", "300 600", "600 900", "900 1200", "1200 1500"]
      max-parallel: 1  # Crucial: Run one by one to stay under the radar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pymongo dnspython

      - name: Verify Identity
        run: |
          echo "Current IP:"
          curl -s https://api.ipify.org
          echo -e "\nUser-Agent check:"
          curl -s -H "User-Agent: Mozilla/5.0" https://httpbin.org/user-agent

      - name: Run Tracking Batch
        run: python main.py ${{ matrix.range }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
