name: Uma Roster Tracker

on:
  schedule:
    # Runs daily at 15:10 UTC (11:10 PM PH Time)
    - cron: '10 15 * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  run:
    runs-on: ubuntu-latest
    # Explicit timeout for the 1500-club/12-minute execution
    timeout-minutes: 30 
    
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Pull latest to avoid conflicts during the long run
          git pull origin main --rebase
          
          git add state/member_state.json
          
          # Only commit if there is actual player movement
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Update state: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
